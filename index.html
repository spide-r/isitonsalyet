<!doctype html>
<html lang="en">
<head>
  <meta property="og:title" content="Is It Onsal Yet?">
  <meta property="og:description" content="Check what frontline map it is today.">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Is it Onsal Yet?</title>
  <link rel ="stylesheet" href="c.css">
</head>

<body>
<main id="m">
    <h1>Is it Onsal Yet?</h1>
    <h2 id="yes-no"></h2>
</main>
<p id="timer-onsal"></p>
<p id="timer-secure"></p>
<p id="timer-seal"></p>
<p id="timer-shatter"></p>
<p id="timer-worqor"></p>
<br>
<h3>Day Checker:</h3>
<label for="chosen-date">Select a date and time in the future: </label><input type="datetime-local" id="chosen-date" name="selectedDate">

<p id="map"></p>

<hr>

<sub>Made by </sub><sub><a href = "https://bsky.app/profile/spiiiiiiiiider.bsky.social">A. S. @ Zalera</a></sub>
<script>
    const startOfOnsal = 1763650800;
    const secsInDay = (24 * 60 * 60);
    const days = 4;
    const cycleLength = days * secsInDay;
    function showTime() {
        const position = getDay()
        let message = "";
        switch (position) {
            case 0:
                message = "Yes!";
                break;
            default:
                message = "No. It is currently " + getDayStr(position) + " and Worqor Chirteh (Triumph)";
        }


        document.getElementById('yes-no').textContent = message;

        document.getElementById('timer-onsal').textContent = getTimer(0);
        document.getElementById('timer-secure').textContent = getTimer(1);
        document.getElementById('timer-seal').textContent = getTimer(2);
        document.getElementById('timer-shatter').textContent = getTimer(3);
        document.getElementById('timer-worqor').textContent = getTimer(4);
    }


    function getNextDay(day) {
        if (day === getDay()) {
            return "Happening now."
        }
        if(day === 4){
            return "Happening always!"
        }
        const currentUnixTime = Math.floor(Date.now() / 1000);
        const timeSinceStartOfCycle = currentUnixTime - startOfOnsal;
        const posInCycleSec = timeSinceStartOfCycle % cycleLength;
        const targetStartTime = day * secsInDay;
        const timeUntilStart = (targetStartTime - posInCycleSec + cycleLength) % cycleLength
        const distance = timeUntilStart * 1000;

        const days = Math.floor(distance / (1000 * 60 * 60 * 24));
        const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
        const seconds = Math.floor((distance % (1000 * 60)) / 1000);

        const d = new Date(Date.now() + distance)

        return d.toDateString() + " in " + days + "d " + hours + "h "
            + minutes + "m " + seconds + "s ";
    }

    function getTimer(day){
        return getDayStr(day) + ": " + getNextDay(day);
    }

    function getDay(){
        const currentUnixTime = Math.floor(Date.now() / 1000);
        return getDayAtTime(currentUnixTime);
    }

    function getDayAtTime(unixTime){
        const timeSinceStartOfCycle = unixTime - startOfOnsal;
        const posInCycleSec = timeSinceStartOfCycle % cycleLength;
        return Math.floor(posInCycleSec / secsInDay);
    }

    function getDayStr(day){
        switch (day) {
            case 0:
                return "Onsal Hakair (Danshig Naadam)";
            case 1:
                return "The Borderland Ruins (Secure)";
            case 2:
                return "Seal Rock (Seize)";
            case 3:
                return "The Fields of Glory (Shatter)"
            case 4:
                return "Worqor Chirteh (Triumph)"
            default:
                return "Unknown";
        }
    }
    showTime()
    const interval = setInterval(showTime, 1000);
    const dateControl =  document.getElementById('chosen-date');
    dateControl.addEventListener('change', setTimeForCal)

    function setTimeForCal(){
        const dateControl =  document.getElementById('chosen-date');
        const unixDate = Math.floor(new Date(dateControl.value).getTime() / 1000)
        const day = getDayAtTime(unixDate);
        if(getDayStr(day) === "Unknown" ){
            return;
        }
        //document.getElementById('map').textContent = unixDate.toString()
        document.getElementById('map').textContent = "At that time, the active map is: " + getDayStr(day)
    }

    setTimeForCal()

    document.addEventListener('DOMContentLoaded', () => {
        const dateTimeInput = document.getElementById('datetime-picker');
        const now = new Date();
        const offset = now.getTimezoneOffset() * 60 * 1000;
        dateTimeInput.min = (new Date(now - offset)).toISOString().slice(0, 16);
    });

</script>

</body>
